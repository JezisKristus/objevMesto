<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploreCity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#" id="homeLink">
            ExploreCity
            <span class="tagline">...prozkoumej svět</span>
        </a>
    </div>
</nav>

<div class="page-layout">
    <div class="main-panel" id="mainPanel">
        <div class="loading-msg">
            <div class="spinner"></div>
            <div>Načítám...</div>
        </div>
    </div>

    <div class="detail-panel" id="detailPanel">
    </div>
</div>

<template id="detailTemplate"> <!-- TODO asi to zkusit využít, vypadá to jako lepší řešení než innerHTML -->
    
</template>

<div class="modal fade" id="placeModal" tabindex="-1" aria-labelledby="placeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="placeForm" novalidate>
                <div class="modal-header">
                    <span class="modal-title" id="placeModalLabel">Přidat nové místo</span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavřít"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="placeId">
                    <input type="hidden" id="placeCityId">

                    <div class="mb-3">
                        <label class="form-label" for="placeName">Název</label>
                        <input type="text" class="form-control" id="placeName" required minlength="2" maxlength="255" placeholder="Název místa">
                        <div class="invalid-feedback">Vyplňte název místa (min. 2 znaky).</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeType">Typ místa</label>
                        <select class="form-select" id="placeType" required>
                            <option value="">-- Vyberte typ --</option>
                            <option value="Restaurace">Restaurace</option>
                            <option value="Památka">Památka</option>
                            <option value="Zajímavost">Zajímavost</option>
                            <option value="Ostatní">Ostatní</option>
                        </select>
                        <div class="invalid-feedback">Vyberte typ místa.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeAddress">Adresa</label>
                        <input type="text" class="form-control" id="placeAddress" required maxlength="255" placeholder="Ulice, město">
                        <div class="invalid-feedback">Vyplňte adresu.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeDesc">Popis</label>
                        <textarea class="form-control" id="placeDesc" rows="3" required placeholder="Stručný popis místa..."></textarea>
                        <div class="invalid-feedback">Vyplňte popis.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Zrušit</button>
                    <button type="submit" class="btn btn-primary" id="placeFormSubmit">Uložit místo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
