<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploreCity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#" id="homeLink">
            ExploreCity
            <span class="text-muted">...prozkoumej svět</span>
        </a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row g-0">
        <div class="col-md-8" id="mainPanel">
            <div class="text-center p-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Načítám...</span>
                </div>
                <div>Načítám...</div>
            </div>
        </div>

        <div class="col-md-4 detail-panel" id="detailPanel">
        </div>
    </div>
</div>
<!--* Našel jsem že dělat to pomocí template je lepší než innerHTML který se mi strašně nelíbilo -->
<template id="detailTemplate">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title"></h5>
            <div>
                <button class="btn btn-sm btn-outline-secondary" title="Upravit místo">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Smazat místo">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="mb-3" style="height:160px; background:#f8f9fa;"></div>
            <p class="card-text">
                <i class="bi bi-geo-alt"></i> <span></span>
            </p>
            <p class="card-text"></p>
            <hr>
            <div class="rating-summary"></div>
            <div class="mb-3">
                <label class="form-label">Přidat hodnocení:</label>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-warning">1★</button>
                    <button class="btn btn-sm btn-outline-warning">2★</button>
                    <button class="btn btn-sm btn-outline-warning">3★</button>
                    <button class="btn btn-sm btn-outline-warning">4★</button>
                    <button class="btn btn-sm btn-outline-warning">5★</button>
                </div>
            </div>
            <div class="comments-section">
                <h6>Komentáře</h6>
                <div id="commentsList" class="list-group"></div>
            </div>
            <div class="new-comment-form mt-3">
                <h6>Nový komentář</h6>
                <form id="commentForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="commentName">Jméno</label>
                        <input type="text" class="form-control" id="commentName" placeholder="Vaše jméno" required minlength="2" maxlength="255">
                        <div class="invalid-feedback">Vyplňte jméno (min. 2 znaky).</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="commentText">Text komentáře</label>
                        <textarea class="form-control" id="commentText" rows="3" placeholder="Napište komentář..." required></textarea>
                        <div class="invalid-feedback">Vyplňte text komentáře.</div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Odeslat</button>
                </form>
            </div>
        </div>
    </div>
</template>

<template id="cityCardTemplate">
    <div class="card">
        <div class="card-img-top" style="height:120px; background:#f8f9fa;"></div>
        <div class="card-body">
            <h5 class="card-title"></h5>
        </div>
    </div>
</template>

<template id="placeCardTemplate">
    <div class="card">
        <div class="card-img-top" style="height:90px; background:#f8f9fa;"></div>
        <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
        </div>
    </div>
</template>

<template id="commentTemplate">
    <div class="list-group-item">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <small class="text-muted"><i class="bi bi-person"></i> <span></span></small>
                <p class="mb-1"></p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <small class="text-muted"></small>
                <button class="btn btn-sm btn-outline-danger" title="Smazat komentář"><i class="bi bi-trash"></i></button>
            </div>
        </div>
    </div>
</template>

<div class="modal fade" id="placeModal" tabindex="-1" aria-labelledby="placeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="placeForm" novalidate>
                <div class="modal-header">
                    <span class="modal-title" id="placeModalLabel">Přidat nové místo</span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavřít"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="placeId">
                    <input type="hidden" id="placeCityId">

                    <div class="mb-3">
                        <label class="form-label" for="placeName">Název</label>
                        <input type="text" class="form-control" id="placeName" required minlength="2" maxlength="255"
                               placeholder="Název místa">
                        <div class="invalid-feedback">Vyplňte název místa (min. 2 znaky).</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeType">Typ místa</label>
                        <select class="form-select" id="placeType" required>
                            <option value="">-- Vyberte typ --</option>
                            <option value="Restaurace">Restaurace</option>
                            <option value="Památka">Památka</option>
                            <option value="Zajímavost">Zajímavost</option>
                            <option value="Ostatní">Ostatní</option>
                        </select>
                        <div class="invalid-feedback">Vyberte typ místa.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeAddress">Adresa</label>
                        <input type="text" class="form-control" id="placeAddress" required maxlength="255"
                               placeholder="Ulice, město">
                        <div class="invalid-feedback">Vyplňte adresu.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="placeDesc">Popis</label>
                        <textarea class="form-control" id="placeDesc" rows="3" required
                                  placeholder="Stručný popis místa..."></textarea>
                        <div class="invalid-feedback">Vyplňte popis.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Zrušit</button>
                    <button type="submit" class="btn btn-primary" id="placeFormSubmit">Uložit místo</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastMsg" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-body"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
